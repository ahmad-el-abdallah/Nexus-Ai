[project]
name = "nexus-ai-backend"
version = "0.1.0"
description = "NEXUS AI — backend API, orchestration and integrations"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "asyncpg>=0.32",
    "fastapi>=0.142",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]
